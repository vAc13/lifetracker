  --ink:#eef0f5; --ink-2:#b9bfcc; --muted:#8a91a1;
  --accent:#8496ff; --accent-ink:#0d0f14; --accent-soft:#232b4f; --accent-text:#aab7ff;
  --good-text:#3fc23f; --crit-text:#f08080;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
/* iPhone home-screen apps lift the fixed tab bar when the page is shorter than the screen
   (seen on Goals and the calendar Day view). Keep every page at least a hair taller than the screen,
   like the tabs where the bar sits correctly. */
:root{min-height:calc(100vh + 1px);min-height:calc(100lvh + 1px)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-stretch:75%;font-weight:800;font-size:20px;letter-spacing:.01em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand-mark{width:22px;height:22px;border-radius:6px;background:var(--accent);display:grid;place-items:center}
.brand-mark svg{width:14px;height:14px;stroke:var(--accent-ink)}
.brand-logo{width:26px;height:26px;border-radius:7px;display:block;flex:none;box-shadow:0 0 0 1px var(--line-soft)}
.savestate{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.savestate i{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block}
.savestate.busy i{background:var(--warn)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;flex:none}
.icon-btn:hover{border-color:var(--ink-2)}
.icon-btn:disabled{opacity:.35;cursor:default}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.02em}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent-text);background:var(--accent-soft)}
.main{max-width:980px;margin:0 auto;overflow-x:clip;padding-inline:16px;padding-block:18px 110px}
@media (min-width:900px){
  .tabs{top:calc(59px + env(safe-area-inset-top,0px));bottom:auto;right:auto;width:96px;height:auto;grid-template-columns:1fr;gap:4px;border:0;background:none;padding:14px 10px}
  .tab{padding:10px 4px;font-size:12px}
  .main{padding-left:120px;max-width:1180px;padding-bottom:60px}
}

/* type */
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.display{font-family:var(--f-display);font-stretch:80%;font-weight:750;letter-spacing:-.005em;line-height:1.05;margin:2px 0 0;text-wrap:balance}
h1.display{font-size:clamp(28px,6vw,40px)}
h2{font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:17px;margin:0;letter-spacing:.005em}
.sub{color:var(--muted);font-size:13px}
.big{font-family:var(--f-display);font-stretch:75%;font-weight:750;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--muted);margin-left:3px;font-stretch:100%}

/* page head */
.pagehead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.pagehead .grow{flex:1;min-width:0}
.pernav{display:flex;align-items:center;gap:8px}
.pernav .lbl{font-weight:600;min-width:0;text-align:center}

/* cards */
.grid{display:grid;gap:14px}
.grid2{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:760px){.grid2{grid-template-columns:1fr 1fr}.span2{grid-column:1/-1}}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-width:0;display:flex;flex-direction:column;gap:12px}
.card-h{display:flex;align-items:center;gap:10px}
.card-h .meta{margin-left:auto;font-size:13px;color:var(--muted);text-align:right}
.empty{color:var(--muted);font-size:14px;padding:4px 0}

/* fields */
.fields{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-size:12px;font-weight:600;color:var(--ink-2)}
.inp{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:10px 11px;font-size:16px;font-variant-numeric:tabular-nums}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.unit{position:relative}
.unit .inp{padding-right:44px}
input[type=time].inp{-webkit-appearance:none;appearance:none;display:block;min-height:46px;max-width:100%;text-align:left}
input[type=time].inp::-webkit-date-and-time-value{text-align:left}
.unit span{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);pointer-events:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row > .inp{flex:1 1 140px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:6px 10px;font-size:13px}
.btn.danger{color:var(--crit-text);border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;font-weight:600;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;background:var(--surface);color:var(--ink-2)}
button.chip:hover{border-color:var(--ink-2)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}

/* progress */
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.bar.thin{height:6px}

/* check rows */
.checks{display:flex;flex-direction:column;gap:6px}
.check{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line-soft);background:var(--surface);border-radius:12px;padding:11px 12px}
.check:hover{border-color:var(--line)}
.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;transition:background .15s,border-color .15s}
.box svg{width:15px;height:15px;stroke:var(--accent-ink);stroke-width:3;fill:none;opacity:0}
.check[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.check[aria-pressed="true"] .box svg{opacity:1}
.check[aria-pressed="true"] .ttl{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.check .ttl{font-weight:600;min-width:0;overflow-wrap:anywhere}
.check .note{font-size:12px;color:var(--muted);font-weight:500}
.check .end{margin-left:auto;font-size:12px;color:var(--muted)}
.streak{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;font-size:12px;color:var(--muted);line-height:1.2;flex:none;text-align:right}
.streak b{font-family:var(--f-display);font-stretch:75%;font-size:18px;color:var(--ink-2)}
.streak.on b{color:var(--accent-text)}
.streak small{font-size:11px}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line-soft);min-width:0}
.li:first-child{border-top:0}
.li .main-t{min-width:0;flex:1}
.li .t{font-weight:600;overflow-wrap:anywhere}
.li .s{font-size:12px;color:var(--muted)}
.li .amt{font-variant-numeric:tabular-nums;font-weight:650;white-space:nowrap}
.amt.in{color:var(--good-text)}
.x{border:0;background:none;color:var(--muted);width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;font-size:18px;line-height:1}
.x:hover{background:var(--surface-2);color:var(--crit-text)}
.confirm{border:1px solid color-mix(in srgb,var(--crit) 50%,var(--line));color:var(--crit-text);background:var(--surface);border-radius:8px;padding:5px 9px;font-size:12px;font-weight:700;flex:none}

/* tiles */
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:13px 14px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:var(--shadow)}
.tile .k{font-size:12px;font-weight:600;color:var(--ink-2)}
.tile .d{font-size:12px;color:var(--muted)}
.delta-up{color:var(--good-text)} .delta-down{color:var(--crit-text)} .delta-flat{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;color:var(--ink-2)}

/* day head */
.dayhead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.dayhead .mid{flex:1;min-width:0}

/* charts */
.chart-wrap{position:relative}
.chart{position:relative;width:100%;min-height:60px}
.chart svg{display:block;width:100%;overflow:visible}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg-line{width:16px;height:2px;border-radius:2px;display:inline-block}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:0 6px 18px rgba(0,0,0,.12);white-space:nowrap;z-index:5;min-width:110px}
.tip b{display:block;margin-bottom:3px;font-size:12px}
.tip div{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.tip div em{font-style:normal;margin-left:auto;padding-left:10px;color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums}
.axis{fill:var(--muted);font-size:11px;font-family:var(--f-body);font-variant-numeric:tabular-nums}

/* category bars */
.hbars{display:flex;flex-direction:column;gap:9px}
.hb{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;font-size:13px}
.hb .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.hb .track{height:10px;border-radius:0 4px 4px 0;overflow:hidden}
.hb .track i{display:block;height:100%;background:var(--s1);border-radius:0 4px 4px 0;min-width:2px}
.hb .v{font-variant-numeric:tabular-nums;font-weight:600}

/* month grid */
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mgrid .wd{font-size:11px;font-weight:700;color:var(--muted);text-align:center;letter-spacing:.06em;padding-bottom:2px}
.mcell{aspect-ratio:1/1;max-width:100%;border-radius:8px;border:1px solid transparent;background:var(--surface-2);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:4px 5px;color:var(--ink-2);min-width:0;position:relative}
.mcell.out{opacity:.35}
.mcell.today{border-color:var(--accent)}
.mcell.sel{outline:2px solid var(--accent);outline-offset:1px}
.mcell.future{background:none;border-color:var(--line-soft)}
button.mcell:hover{border-color:var(--ink-2)}
.mcell .dots{display:flex;gap:3px;flex-wrap:wrap}
.mcell .dots i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.mcell .ev{font-size:10px;font-weight:600;color:var(--ink);background:var(--surface);border-radius:4px;padding:1px 4px;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:none}
@media (min-width:760px){.cal .mcell{aspect-ratio:auto;min-height:92px;justify-content:flex-start;gap:3px}.cal .mcell .ev{display:block}.cal .mcell .dots{display:none}}
.heat-legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.heat-legend i{width:14px;height:14px;border-radius:4px;display:inline-block}

/* week dots */
.wdots{display:flex;gap:4px}
.wdots i{width:18px;height:18px;border-radius:5px;background:var(--surface-2);display:grid;place-items:center;font-style:normal;font-size:10px;color:var(--muted)}
.wdots i.on{background:var(--accent);color:var(--accent-ink)}
.wdots i.na{background:none;border:1px dashed var(--line)}

/* table */
.tbl-wrap{overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%;font-size:13px;min-width:620px}
.tbl th{text-align:right;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{text-align:right;padding:8px;border-bottom:1px solid var(--line-soft);font-variant-numeric:tabular-nums}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tr:last-child td{border-bottom:0}

/* event list */
.events{display:flex;flex-direction:column;gap:6px}
.event{display:grid;grid-template-columns:62px minmax(0,1fr) auto;align-items:start;gap:10px;padding:8px 10px;border-radius:10px;background:var(--surface-2);text-decoration:none;color:inherit;min-width:0}
.event .tm{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent-text)}
.event .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.event .lc{font-size:12px;color:var(--muted)}
a.nm{color:inherit;text-decoration:none} a.nm:hover{text-decoration:underline}
.event .x{width:26px;height:26px;margin:-3px -4px 0 0}
.evgroup-h{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:4px 0}
.evgroup{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(130px,1fr);gap:6px;overflow-x:auto;padding-bottom:2px}
.event.ev-c{display:flex;flex-direction:column;gap:2px;min-width:0}
.notice{border:1px dashed var(--line);border-radius:12px;padding:12px;font-size:13px;color:var(--ink-2);display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* day view: the page itself does not scroll, only the time grid does */
html.cal-lock,html.cal-lock body{overscroll-behavior:none}
html.cal-lock .top-in{padding-top:6px;padding-bottom:6px}
html.cal-lock .main{padding-bottom:0;padding-top:10px}
.pagehead.compact{margin-bottom:8px;align-items:center}
.pagehead.compact h1.display{font-size:28px;margin:0}
/* day view: time grid (long-press an empty slot to create an event) */
.dayv{padding:6px 0 0;gap:0;overflow:hidden}
.wstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;padding:0 8px 6px}
.wstrip button{border:0;background:none;border-radius:10px;padding:2px 0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.04em}
.wstrip button b{font-family:var(--f-display);font-stretch:80%;font-size:17px;font-weight:700;color:var(--ink);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.wstrip button.today b{color:var(--crit-text)}
.wstrip button[aria-pressed="true"] b{background:var(--ink);color:var(--bg)}
.wstrip button.today[aria-pressed="true"] b{background:var(--crit);color:#fff}
.alld{display:flex;gap:6px;align-items:flex-start;padding:6px 10px;border-top:1px solid var(--line-soft)}
.alld .lb{font-size:10px;font-weight:700;color:var(--muted);width:38px;flex:none;padding-top:3px;letter-spacing:.04em}
.alld .ls{display:flex;flex-wrap:wrap;gap:4px;min-width:0;flex:1}
.alld .ae{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:color-mix(in srgb,var(--c) 22%,var(--surface));border-left:3px solid var(--c);color:var(--ink);text-decoration:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tgrid{position:relative;overflow-y:auto;overscroll-behavior:contain;border-top:1px solid var(--line-soft);height:520px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tg-in{position:relative;margin-left:48px;margin-right:8px}
.tg-h{position:absolute;left:0;right:0;border-top:1px solid var(--line-soft);pointer-events:none}
.tg-h span{position:absolute;left:-46px;top:-8px;width:38px;text-align:right;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.tg-h.half{border-top-style:dashed;opacity:.55}
.tev{position:absolute;border-radius:6px;padding:3px 6px;font-size:12px;line-height:1.25;overflow:hidden;color:var(--ink);text-decoration:none;background:color-mix(in srgb,var(--c) 24%,var(--surface));border-left:3px solid var(--c);box-shadow:0 0 0 1px var(--surface);-webkit-touch-callout:none}
.tev b{font-weight:650;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tev small{color:var(--ink-2);font-size:11px;font-variant-numeric:tabular-nums}
.tev.past{opacity:.6}
.tnow{position:absolute;left:-6px;right:0;height:2px;background:var(--crit);pointer-events:none;z-index:3}
.tnow::before{content:"";position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--crit)}
.tdraft{position:absolute;left:0;right:0;z-index:4;border-radius:8px;border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 22%,transparent);touch-action:none;padding:3px 8px;font-size:12px;font-weight:650;color:var(--accent-text);overflow:visible}
.tdraft .dt{display:block;padding-left:14px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tdraft.saving{border-style:dashed;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.dh{position:absolute;width:44px;height:44px;display:grid;place-items:center;touch-action:none;z-index:5}
.dh::after{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--accent);background:var(--surface)}
.dh.dh-s{top:-22px;left:-8px}
.dh.dh-e{bottom:-22px;right:-8px}
.tdraft.saving .dh{display:none}
.evpeek{position:fixed;left:0;right:0;margin:0 auto;bottom:0;z-index:45;max-width:560px;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);padding:4px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:4px;transform:translateY(0);transition:transform .28s cubic-bezier(.22,.9,.3,1);will-change:transform;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.evpeek *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.evpeek.in{animation:pkin .32s cubic-bezier(.22,.9,.3,1)}
@keyframes pkin{from{transform:translateY(105%)}}
.evpeek.mini{transform:translateY(var(--mh,60px))}
.evpeek.out{transform:translateY(105%)!important;transition-duration:.22s}
.evpeek .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:2px auto 4px}
.pk-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-2)}
.pk-h .x{margin-left:auto}

<script>
(() => {
'use strict';

/* ---------- utilities ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayISO = () => iso(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const mondayOf = s => { const d = parse(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return iso(d); };
const dayOfYear = s => { const d = parse(s); return Math.round((d - new Date(d.getFullYear(), 0, 1)) / 864e5) + 1; };
function isoWeek(s) { const th = addDays(mondayOf(s), 3); return `${th.slice(0, 4)}-W${pad(Math.ceil(dayOfYear(th) / 7))}`; }
const weekNo = s => Number(isoWeek(s).split('-W')[1]);
const daysInMonth = (y, m) => new Date(y, m, 0).getDate();
const monthEnd = mk => { const [y, m] = mk.split('-').map(Number); return `${mk}-${pad(daysInMonth(y, m))}`; };
const nextMonth = mk => { let [y, m] = mk.split('-').map(Number); m++; if (m > 12) { m = 1; y++; } return `${y}-${pad(m)}`; };
const prevMonth = mk => { let [y, m] = mk.split('-').map(Number); m--; if (m < 1) { m = 12; y--; } return `${y}-${pad(m)}`; };
const rid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const num = v => { if (v === null || v === undefined) return null; const s = String(v).trim().replace(',', '.').replace(/\s/g, ''); if (s === '') return null; const n = Number(s); return Number.isFinite(n) ? n : NaN; };
const fmt = (n, d = 0) => n == null || isNaN(n) ? '–' : Number(n).toLocaleString('en-GB', { minimumFractionDigits: d, maximumFractionDigits: d });
const money = (n, cur = 'PLN') => { if (n == null || isNaN(n)) return '–'; const v = fmt(Math.abs(n), 2); const s = n < 0 ? '−' : ''; return cur === 'EUR' ? `${s}€${v}` : cur === 'USD' ? `${s}$${v}` : `${s}${v} zł`; };
const fmtDur = m => m == null ? '–' : `${Math.floor(m / 60)}h ${pad(Math.round(m % 60))}m`;
const fmtLong = s => parse(s).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
const fmtShort = s => parse(s).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
const fmtDM = s => parse(s).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const fmtMonth = mk => parse(mk + '-01').toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
const fmtMonShort = mk => parse(mk + '-01').toLocaleDateString('en-GB', { month: 'short' });
const avg = a => { const v = a.filter(x => x != null && !isNaN(x)); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };
const sum = a => a.reduce((s, x) => s + (x || 0), 0);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const CHECK = '<svg viewBox="0 0 24 24"><polyline points="5 12 10 17 19 7" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ---------- defaults (used until settings are saved) ---------- */
const DEFAULTS = {
  start: null,
  kcalTarget: 3000,
  proteinTarget: null,
  habits: [
    { id: 'bluelight', name: 'Blue light filter from 21:00' },
    { id: 'creatine', name: 'Creatine', note: 'Any time of day' },
    { id: 'ashwagandha', name: 'Ashwagandha', note: 'With the last meal' },
    { id: 'reading', name: 'Read at least 1 chapter' }
  ],
  expenseCats: ['Groceries', 'Eating out', 'Transport', 'Housing & bills', 'Subscriptions', 'Sport & supplements', 'Health', 'Clothes', 'Entertainment', 'Education', 'Gifts', 'Other'],
  incomeCats: ['Salary', 'Freelance', 'Coaching', 'Gift', 'Sale', 'Other'],
  fx: { EUR: 4.25, USD: 3.65 },
  hiddenCals: []
};
const WORKOUTS = [
  { id: 'gym', name: 'Gym', color: 'var(--s1)' },
  { id: 'football', name: 'Football', color: 'var(--s2)' },
  { id: 'swimming', name: 'Swimming', color: 'var(--s3)' },
  { id: 'other', name: 'Other', color: 'var(--s4)' }
];
const wType = id => WORKOUTS.find(w => w.id === id) || WORKOUTS[3];
const CURRENCIES = ['PLN', 'EUR', 'USD'];
const INV = 'Investments';
const CAL = 'Google Calendar', CAL_TOOL = 'list_events';

/* ---------- state ---------- */
const S = {
  db: null, mcp: null, status: 'loading',
  days: {}, tx: [], rec: [], sav: [], goals: [], settings: null,
  loaded: {}, fresh: {},
  tab: 'today', date: null,
  health: { range: 30 },
  money: { anchor: null },
  goalsUI: { level: 'day', anchor: null },
  review: { level: 'week', anchor: null },
  calUI: { view: 'day', anchor: null, sel: null, gridTop: null }, draft: null,
  cal: { day: {}, range: {} }, calendars: null, calListErr: null, calRole: {}, evHidden: new Set(),
  confirm: null, sheet: null, genDone: null, lastToday: todayISO()
};
const cfg = () => {
  const s = S.settings || {};
  return {
    ...DEFAULTS, ...s,
    fx: { ...DEFAULTS.fx, ...(s.fx || {}) },
    habits: s.habits || DEFAULTS.habits,
    expenseCats: s.expenseCats || DEFAULTS.expenseCats,
    incomeCats: s.incomeCats || DEFAULTS.incomeCats,
    start: s.start || firstDataDay() || todayISO()
  };
};
function firstDataDay() { const k = Object.keys(S.days).sort(); return k[0] || null; }
const viewDate = () => S.date || todayISO();
const day = d => S.days[d] || {};
const activeHabits = d => cfg().habits.filter(h => (!h.from || h.from <= d) && (!h.to || d < h.to));
const toPLN = (amount, cur) => cur === 'PLN' ? amount : amount * (cfg().fx[cur] || 1);

/* ---------- writes ---------- */
let pending = 0;
const chains = {};
function setSaveState() {
  const el = $('#savestate'); if (!el) return;
  const L = window.LT, ls = L ? L.state() : 'synced';
  if (S.status !== 'loading' || ls === 'signin') hideSplash(); // data is in (or sign-in is needed): drop the launch logo
  if (S.status === 'ready' && L) {
    if (ls === 'signin') { el.className = 'savestate busy'; el.innerHTML = '<i></i><button class="btn small" data-act="lt-signin">Sign in to sync</button>'; return; }
    if (ls === 'offline') { el.className = 'savestate busy'; el.innerHTML = `<i></i><span>${L.pending() ? 'Offline · saved on this phone' : 'Offline'}</span>`; return; }
    if (ls === 'error') { el.className = 'savestate busy'; el.innerHTML = '<i></i><button class="btn small" data-act="lt-sync">Sync failed · retry</button>'; return; }
    if (ls === 'syncing' || pending) { el.className = 'savestate busy'; el.innerHTML = '<i></i><span>Saving…</span>'; return; }
  }
  if (S.status === 'nodb') { el.className = 'savestate busy'; el.innerHTML = '<i></i><span>Not connected</span>'; return; }
  if (S.status === 'loading' && L && ls === 'signin') { el.className = 'savestate busy'; el.innerHTML = '<i></i><span>Signed out</span>'; return; }
  if (S.status === 'loading') { el.className = 'savestate busy'; el.innerHTML = '<i></i><span>Loading</span>'; return; }
  el.className = 'savestate' + (pending ? ' busy' : '');
  el.innerHTML = `<i></i><span>${pending ? 'Saving…' : 'Saved'}</span>`;
}
function writeError(e) {
  const c = e && e.code;
  const msg = c === 'quota_exceeded' ? 'Storage is full. Delete some old entries, then try again.'
    : c === 'revoked' ? 'This page lost access to your data. Reload the page to continue.'
    : c === 'invalid_argument' ? 'That change could not be saved. Check the values and try again.'
    : 'Could not save. Check your connection and try again.';
  toast(msg, 4500);
}
function queue(path, fn) {
  pending++; setSaveState();
  const run = async () => {
    try { await fn(); }
    catch (e) {
      if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 600 + Math.random() * 800)); await fn(); }
      else throw e;
    }
  };
  const p = (chains[path] || Promise.resolve()).then(run).catch(writeError).finally(() => { pending--; setSaveState(); });
  chains[path] = p; return p;
}
function mergeDoc(coll, id, patch) {
  if (!S.db) return;
  const path = `${coll}/${id}`;
  return queue(path, async () => { const ref = S.db.doc(path); const snap = await ref.get(); if (snap.exists) await ref.update(patch); else await ref.set(patch); });
}
function setDoc(coll, id, data) { if (!S.db) return; const path = `${coll}/${id}`; return queue(path, () => S.db.doc(path).set(data)); }
function delDoc(coll, id) { if (!S.db) return; const path = `${coll}/${id}`; return queue(path, () => S.db.doc(path).delete()); }
function saveDay(d, patch) {
  const cur = S.days[d] || { date: d }, next = { ...cur };
  for (const k in patch) { const v = patch[k]; next[k] = v && typeof v === 'object' && !Array.isArray(v) ? { ...(cur[k] || {}), ...v } : v; }
  S.days = { ...S.days, [d]: next };
  return mergeDoc('days', d, { date: d, ...patch });
}
const saveSettings = patch => mergeDoc('meta', 'settings', patch);

/* ---------- data subscription ---------- */
function subscribe() {
  const onErr = key => e => { S.loaded[key] = true; if (e && e.code === 'revoked') toast('This page lost access to your data. Reload the page.', 5000); scheduleRender(); };
  const coll = (name, key, fn) => S.db.collection(name).onSnapshot(snap => {
    fn(snap.docs.map(d => ({ id: d.id, ...d.data() })));
    S.loaded[key] = true; if (!snap.metadata.fromCache) S.fresh[key] = true; afterData();
  }, onErr(key));
  coll('days', 'days', rows => { const o = {}; rows.forEach(r => { o[r.id] = r; }); S.days = o; });
  coll('tx', 'tx', rows => { S.tx = rows; });
  coll('recurring', 'rec', rows => { S.rec = rows; });
  coll('savings', 'sav', rows => { S.sav = rows; });
  coll('goals', 'goals', rows => { S.goals = rows; });
  S.db.doc('meta/settings').onSnapshot(snap => {
    S.settings = snap.exists ? snap.data() : null; S.loaded.settings = true;
    if (!snap.metadata.fromCache) S.fresh.settings = true; afterData();
  }, onErr('settings'));
}
const KEYS = ['days', 'tx', 'rec', 'sav', 'goals', 'settings'];
function afterData() {
  if (S.status === 'loading' && KEYS.every(k => S.loaded[k])) S.status = 'ready';
  if (S.status === 'ready') quickAdd();
  setSaveState();
  if (KEYS.every(k => S.fresh[k]) && S.genDone !== todayISO()) { S.genDone = todayISO(); generateRecurring(); }
  scheduleRender();
}

/* ---------- quick add from Apple Shortcuts links ---------- */
function quickAdd() {
  if (!window.LT || !LT.takeQuick) return;
  const items = LT.takeQuick(); if (!items.length) return;
  const c = cfg(), msgs = [];
  items.forEach(q => {
    const a = num(q.amount);
    if (a == null || Number.isNaN(a) || a <= 0) { msgs.push('Shortcut entry skipped: the amount was missing'); return; }
    const kind = q.kind === 'income' ? 'income' : 'expense', cats = kind === 'income' ? c.incomeCats : c.expenseCats;
    const want = String(q.cat || '').trim().toLowerCase();
    const cat = cats.find(x => x.toLowerCase() === want) || cats.find(x => want && x.toLowerCase().startsWith(want)) || (cats.includes('Other') ? 'Other' : cats[cats.length - 1]);
    const cur = CURRENCIES.includes(q.cur) ? q.cur : 'PLN';
    const date = /^\d{4}-\d{2}-\d{2}$/.test(q.date || '') && q.date <= todayISO() ? q.date : todayISO();
    const id = q.id ? 'sc-' + String(q.id).replace(/[^A-Za-z0-9_-]/g, '').slice(0, 40) : rid();
    if (S.tx.some(x => x.id === id)) return;
    setDoc('tx', id, { date, kind, amount: Math.round(a * 100) / 100, currency: cur, pln: Math.round(toPLN(a, cur) * 100) / 100, category: cat, note: (q.note || '').trim().slice(0, 100) || null, source: 'shortcut', created: Date.now() });
    S.tx = [...S.tx, { id, date, kind, amount: a, currency: cur, pln: toPLN(a, cur), category: cat, created: Date.now() }];
    msgs.push(`${kind === 'income' ? 'Income' : 'Expense'} added: ${money(a, cur)} · ${cat}`);
  });
  if (msgs.length) setTimeout(() => toast(msgs.join(' · '), 4500), 50);
}

/* ---------- recurring income & subscriptions ---------- */
function dueDate(r, mk) {
  if (r.cycle === 'yearly') { const sm = Number((r.start || mk).slice(5, 7)); if (Number(mk.slice(5, 7)) !== sm) return null; }
  const [y, m] = mk.split('-').map(Number);
  return `${mk}-${pad(Math.min(Number(r.day) || 1, daysInMonth(y, m)))}`;
}
async function generateRecurring() {
  if (!S.db) return;
  const t = todayISO(), cur = t.slice(0, 7);
  const have = new Set(S.tx.map(x => x.id));
  for (const r of S.rec) {
    if (r.active === false || !r.start) continue;
    let mk = r.start, guard = 0;
    while (mk <= cur && guard++ < 240) {
      const due = dueDate(r, mk);
      const id = `r-${r.id}-${mk}`;
      if (due && due <= t && !have.has(id) && !(r.skip || []).includes(mk)) {
        await setDoc('tx', id, {
          date: due, kind: r.kind === 'income' ? 'income' : 'expense', amount: r.amount, currency: r.currency || 'PLN',

/* ---------- views: Health ---------- */
function bucketize(dates, fn, size) {
  if (size === 1) return { labels: dates, values: dates.map(fn) };
  const labels = [], values = [];
  for (let i = 0; i < dates.length; i += size) { const chunk = dates.slice(i, i + size); labels.push(chunk[0]); values.push(avg(chunk.map(fn))); }
  return { labels, values };
}
function renderHealth() {
  const R = S.health.range, t = todayISO(), start = addDays(t, -(R - 1));
  const dates = []; for (let d = start; d <= t; d = addDays(d, 1)) dates.push(d);
  const A = agg(start, t), P = agg(addDays(start, -R), addDays(start, -1)), c = cfg();
  const lastW = (() => { for (let i = dates.length - 1; i >= 0; i--) if (day(dates[i]).weight != null) return { d: dates[i], w: day(dates[i]).weight }; return null; })();
  const w7 = weightAvg7(t), w7p = weightAvg7(addDays(t, -7));
  const size = R > 90 ? 7 : 1, lblW = size === 7 ? (s => 'Week of ' + fmtDM(s)) : fmtShort;
  const wDaily = bucketize(dates, d => day(d).weight, size);
  const wAvg = size === 1 ? dates.map(weightAvg7) : null;
  const sc = bucketize(dates, d => (day(d).sleep || {}).score, size);
  const sm = bucketize(dates, d => { const m = sleepMin(day(d).sleep); return m == null ? null : m / 60; }, size);
  const kc = bucketize(dates, d => day(d).kcal, size);
  const weeks = []; for (let w = mondayOf(start); w <= t; w = addDays(w, 7)) weeks.push(w);
  const tSeries = WORKOUTS.map(wt => ({ name: wt.name, type: 'bar', color: wt.color, values: weeks.map(w => { let n = 0; for (let i = 0; i < 7; i++) { const d = addDays(w, i); if (d < start || d > t) continue; n += (day(d).workouts || []).filter(x => (wType(x.type).id) === wt.id).length; } return n; }), fmt: v => `${fmt(v)} sessions` }));
  return `
  <div class="pagehead"><div class="grow"><div class="eyebrow">Health</div><h1 class="display">Body, sleep and training</h1></div>${seg('hrange', [[30, '30 days'], [90, '90 days'], [365, '1 year']], R)}</div>
  <div class="tiles">
    ${tile('Weight, 7-day avg', w7 != null ? `${fmt(w7, 1)}<small>kg</small>` : '–', w7 != null && w7p != null ? deltaHTML(w7, w7p, ' kg', 1, true, 'vs a week ago') : lastW ? `Last: ${fmt(lastW.w, 1)} kg on ${fmtDM(lastW.d)}` : 'Log your weight each morning')}
    ${tile('Sleep Score, avg', A.sleepScore != null ? `${fmt(A.sleepScore)}<small>/100</small>` : '–', A.sleepScore != null ? deltaHTML(A.sleepScore, P.sleepScore, '', 0, true) || scorePill(A.sleepScore) : 'From Apple Sleep Score')}
    ${tile('Sleep, avg', A.sleepMin != null ? fmtDur(A.sleepMin) : '–', `${A.sleepN} nights logged`)}
    ${tile('Calories, avg', A.kcal != null ? `${fmt(A.kcal)}<small>kcal</small>` : '–', `${A.kcalOn}/${A.kcalN} days at ${fmt(c.kcalTarget)}+`)}
    ${tile('Training', `${A.sessions}<small>sessions</small>`, `${fmtDur(A.trainMin)} · ${fmt(A.trainKcal)} kcal burned`)}
  </div>
  <div class="grid2" style="margin-top:14px">
    <section class="card span2"><div class="card-h"><h2>Weight</h2><div class="meta">fasted, kg</div></div>
      ${chartSlot('c-weight', { title: 'Weight', labels: wDaily.labels, height: 210, tipLabel: lblW, series: size === 1 ? [{ name: 'Morning weight', type: 'dots', color: 'var(--muted)', values: wDaily.values, fmt: v => fmt(v, 1) + ' kg' }, { name: '7-day average', type: 'line', color: 'var(--accent)', values: wAvg, fmt: v => fmt(v, 1) + ' kg' }] : [{ name: 'Weekly average', type: 'line', color: 'var(--accent)', values: wDaily.values, fmt: v => fmt(v, 1) + ' kg' }] })}
    </section>
    <section class="card"><div class="card-h"><h2>Sleep Score</h2><div class="meta">${size === 7 ? 'weekly avg' : 'per night'}</div></div>
      ${chartSlot('c-score', { title: 'Sleep Score', labels: sc.labels, zero: true, max: 100, tipLabel: lblW, series: [{ name: 'Sleep Score', type: 'bar', color: 'var(--s1)', colorFn: v => band(v).c, values: sc.values, fmt: v => `${fmt(v)} · ${band(v).k}` }], extraLegend: '' })}
      <div class="legend"><span><i class="dot" style="background:var(--good)"></i>Good 80+</span><span><i class="dot" style="background:var(--warn)"></i>Fair 60–79</span><span><i class="dot" style="background:var(--crit)"></i>Poor under 60</span></div>
    </section>
    <section class="card"><div class="card-h"><h2>Sleep duration</h2><div class="meta">hours</div></div>
      ${chartSlot('c-sleep', { title: 'Sleep duration', labels: sm.labels, zero: true, tipLabel: lblW, series: [{ name: 'Sleep', type: 'bar', color: 'var(--s1)', values: sm.values, fmt: v => fmtDur(v * 60) }] })}
    </section>
    <section class="card"><div class="card-h"><h2>Calories</h2><div class="meta">kcal</div></div>
      ${chartSlot('c-kcal', { title: 'Calories', labels: kc.labels, zero: true, target: c.kcalTarget, targetLabel: `Target ${fmt(c.kcalTarget)}`, tipLabel: lblW, series: [{ name: 'Calories', type: 'bar', color: 'var(--s1)', values: kc.values, fmt: v => fmt(v) + ' kcal' }] })}
    </section>
    <section class="card"><div class="card-h"><h2>Training per week</h2><div class="meta">sessions</div></div>
      ${chartSlot('c-train', { title: 'Training per week', labels: weeks, stack: true, zero: true, minHi: 4, int: true, yFmt: v => fmt(v), tipLabel: s => 'Week of ' + fmtDM(s), series: tSeries })}
    </section>
  </div>`;
}

/* ---------- views: Goals ---------- */

    const ch = children(g.id), par = g.parent ? S.goals.find(x => x.id === g.parent) : null, pr = goalProgress(g);
    return `<div class="card" style="gap:10px">

  return `

    <form class="card" data-form="goal-new">

      const run = moving ? moveEvent(sh.edit, calId).then(() => S.mcp.callTool(CAL, 'update_event', { ...upd, calendarId: calId })) : S.mcp.callTool(CAL, 'update_event', upd);
      run.then(() => { toast('Event updated'); refreshCal(); })
        .catch(err => { Object.assign(e, before); sh.saving = false; S.sheet = sh; render(); toast(calWriteMsg(err, 'change'), 5500); refreshCal(); });
      return;
    }
    if (loc) input.location = loc; if (notes) input.description = notes;
    Object.assign(sh, { title, cal: calId, date, loc, notes, start: val('#f-ev-start') || sh.start, end: val('#f-ev-end') || sh.end });
    S.lastCal = calId;
    // Close the editor right away and keep a placeholder block on the grid until Google confirms.
    S.sheet = null; renderSheet();
    if (sM != null) S.draft = { date, s: sM, e: eM, cal: calId, title, saving: true }; else S.draft = null;
    render();
    S.mcp.callTool(CAL, 'create_event', input)
      .then(r => {
        const cal = (S.calendars || []).find(x => x.id === calId);
        if (cal && r && r.payload && r.payload.id) ['day', 'range'].forEach(k2 => { const C = S.cal[k2]; if (C.byCal && C.byCal[calId]) C.byCal[calId] = [...C.byCal[calId], ...normEvents({ events: [r.payload] }, cal)]; });
        if (S.draft && S.draft.saving) S.draft = null;
        toast('Event added'); scheduleRender(); refreshCal();
      })
      .catch(e => {
        if (S.draft && S.draft.saving) S.draft = sh.fromDraft && sM != null ? { date, s: sM, e: eM, cal: calId } : null;
        sh.saving = false; S.sheet = sh; render();
        toast(calWriteMsg(e, 'add'), 5500); const c = e && e.code; if (c === 'server_unavailable' || c === 'upstream_error') refreshCal();
      });
  }
  else if (k === 'sav-new') {
    const name = val('#f-sv-name').trim(), a = num(val('#f-sv-target')); if (!name || !amountOk(a, 'Enter a target amount')) return;
    setDoc('savings', rid(), { name, target: Math.round(a * 100) / 100, currency: 'PLN', by: val('#f-sv-by') || null, contributions: [], created: Date.now() }); f.reset(); f.closest('details').open = false;
  }
  else if (k === 'sav-add') {
    const g = S.sav.find(x => x.id === f.dataset.id); if (!g) return;
    const a = num(($('input', f) || {}).value); if (a == null || Number.isNaN(a) || a === 0) { toast('Enter an amount. Use a minus sign to take money out.'); return; }
    mergeDoc('savings', g.id, { contributions: [...(g.contributions || []), { id: rid(), date: t, amount: a, pln: Math.round(a * 100) / 100 }] }); f.reset(); toast(a > 0 ? 'Added to ' + g.name : 'Withdrawn from ' + g.name);
  }
  else if (k === 'habit-add') {
    const name = val('#s-h-new').trim(); if (!name) return;
    const base = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 24) || 'habit';
    saveSettings({ habits: [...cfg().habits, { id: base + '-' + rid().slice(0, 4), name, from: t }] }); f.reset();
  }
  else if (k === 'cat-add') {
    const inp = $('input', f), name = inp.value.trim(); if (!name) return;
    const key = f.dataset.k === 'e' ? 'expenseCats' : 'incomeCats'; const list = cfg()[key];
    if (list.some(x => x.toLowerCase() === name.toLowerCase())) { toast('That category already exists'); return; }
    saveSettings({ [key]: [...list, name] }); f.reset();
  }
});

/* ---------- export ---------- */
let xlsxLoading = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!xlsxLoading) xlsxLoading = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => window.XLSX ? res(window.XLSX) : rej(new Error('load'));
    s.onerror = () => { xlsxLoading = null; rej(new Error('load')); };
    document.head.appendChild(s);
  });
  return xlsxLoading;
}
async function saveFile(filename, data) {
  try { await S.dl.save({ filename, data }); toast('Export ready'); }
  catch (e) {
    const c = e && e.code;
    if (c === 'declined') return;
    toast(c === 'rate_limited' ? 'Another save prompt is already open. Finish it, then try again.'
      : c === 'extension_not_enabled' ? 'Excel files can\'t be saved in this view. Use the full backup instead.'
      : c === 'too_large' ? 'The file is too large to save here.'
      : 'Export isn\'t available in this view.', 4500);
  }
}
const sortDate = (a, b) => (a.date || '').localeCompare(b.date || '') || (a.created || 0) - (b.created || 0);
function exportRows() {
  const c = cfg(), allHabits = c.habits;
  const ds = Object.keys(S.days).sort();
  const days = ds.map(d => {
    const x = S.days[d], sl = x.sleep || {}, m = sleepMin(sl), hv = x.habits || {}, st = d >= c.start ? dayHabitStat(d) : null;
    const row = { Date: d, 'Weight (kg)': x.weight ?? '', 'Sleep Score': sl.score ?? '', 'Fell asleep': sl.bed || '', 'Woke up': sl.wake || '', 'Sleep (h)': m == null ? '' : Math.round(m / 6) / 10, Calories: x.kcal ?? '', 'Protein (g)': x.protein ?? '', 'Habits done': st ? st.done : '', 'Habits total': st ? st.total : '' };
    allHabits.forEach(h => { const act = activeHabits(d).some(a => a.id === h.id) && d >= c.start; row[h.name] = act ? (hv[h.id] ? 'Yes' : 'No') : ''; });
    return row;
  });
  const training = ds.flatMap(d => (S.days[d].workouts || []).map(w => ({ Date: d, Type: wType(w.type).name, Minutes: w.min ?? '', 'Kcal burned': w.kcal ?? '', Note: w.note || '' })));
  const moneyRows = S.tx.slice().sort(sortDate).map(x => ({ Date: x.date, Type: x.kind === 'income' ? 'Income' : 'Expense', Category: x.category || '', Note: x.note || '', Amount: x.amount, Currency: x.currency || 'PLN', 'Amount (PLN)': x.pln, Source: x.source === 'recurring' ? 'Automatic' : 'Manual' }));
  const recurring = S.rec.slice().sort((a, b) => (a.created || 0) - (b.created || 0)).map(r => ({ Kind: r.kind === 'income' ? 'Monthly income' : 'Subscription', Name: r.name, Amount: r.amount, Currency: r.currency || 'PLN', Billing: r.cycle === 'yearly' ? 'Yearly' : 'Monthly', Day: r.day, 'First month': r.start, Category: r.category || '', Status: r.active === false ? 'Paused' : 'Active' }));
  const savings = S.sav.flatMap(g => { const cs = (g.contributions || []); const base = { Goal: g.name, 'Target (PLN)': g.target, 'Target date': g.by || '' }; return cs.length ? cs.map(x => ({ ...base, Date: x.date, 'Amount (PLN)': x.pln })) : [{ ...base, Date: '', 'Amount (PLN)': '' }]; });
  const order = { year: 0, month: 1, week: 2, day: 3 };
  const goals = S.goals.slice().sort((a, b) => order[a.level] - order[b.level] || String(a.period).localeCompare(String(b.period)) || (a.created || 0) - (b.created || 0)).map(g => { const p = g.parent ? S.goals.find(x => x.id === g.parent) : null; return { Level: g.level[0].toUpperCase() + g.level.slice(1), Period: g.period, Goal: g.title, Done: g.done ? 'Yes' : 'No', 'Part of': p ? p.title : '' }; });
  return { days, training, moneyRows, recurring, savings, goals };
}
async function exportXLSX() {
  if (!S.dl || S.exporting) return;
  S.exporting = 'xlsx'; renderSheet();
  try {
    const X = await loadXLSX(), r = exportRows(), wb = X.utils.book_new();
    const add = (name, rows, empty) => { const ws = rows.length ? X.utils.json_to_sheet(rows) : X.utils.aoa_to_sheet([[empty]]); if (rows.length) ws['!cols'] = Object.keys(rows[0]).map(k => ({ wch: Math.max(10, Math.min(40, k.length + 2, ...rows.slice(0, 200).map(x => String(x[k] ?? '').length + 2))) })); X.utils.book_append_sheet(wb, ws, name); };
    add('Days', r.days, 'No days logged yet');
    add('Training', r.training, 'No sessions logged yet');
    add('Money', r.moneyRows, 'No income or expenses yet');
    add('Subscriptions & income', r.recurring, 'No monthly income or subscriptions yet');
    add('Savings', r.savings, 'No savings goals yet');
    add('Goals', r.goals, 'No goals yet');
    const buf = X.write(wb, { bookType: 'xlsx', type: 'array' });
    S.exporting = null; renderSheet();
    await saveFile(`lifetracker-${todayISO()}.xlsx`, new Uint8Array(buf));
  } catch (e) { toast('The Excel export could not be prepared. Try again, or use the full backup.', 4500); }
  finally { S.exporting = null; renderSheet(); }
}
async function exportJSON() {
  if (!S.dl || S.exporting) return;
  const data = { app: 'Lifetracker', exportedAt: new Date().toISOString(), settings: S.settings, days: Object.values(S.days).sort(sortDate), transactions: S.tx.slice().sort(sortDate), recurring: S.rec, savings: S.sav, goals: S.goals };
  await saveFile(`lifetracker-backup-${todayISO()}.json`, JSON.stringify(data, null, 2));
}

/* ---------- midnight rollover ---------- */
setInterval(() => {
  const t = todayISO();
  if (t !== S.lastToday) {
    S.lastToday = t;
    if (S.date && S.date >= t) S.date = null;
    if (S.genDone !== t && KEYS.every(k => S.fresh[k])) { S.genDone = t; generateRecurring(); }
    scheduleRender();
  }
}, 30000);

/* ---------- boot ---------- */
window.addEventListener('lt-sync', () => { setSaveState(); if (S.sheet && S.sheet.type === 'settings') renderSheet(); });
render();
const cl = window.claude;
if (!cl || typeof cl.use !== 'function') { S.status = 'nodb'; render(); }
else {
  cl.use('db').then(db => { if (!db) { S.status = 'nodb'; render(); return; } S.db = db; subscribe(); }).catch(() => { S.status = 'nodb'; render(); });
  cl.use('mcp').then(m => { S.mcp = m || null; loadCalendars(); scheduleRender(); }).catch(() => { S.mcp = null; });
  cl.use('downloads').then(dl => { S.dl = dl || null; if (S.sheet) renderSheet(); }).catch(() => { S.dl = null; });
}
})();
</script>

<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
</script>
